# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/darkroom.jerome-arfouche.ca/before/*;

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name darkroom.jerome-arfouche.ca;
    server_tokens off;
    root /home/forge/darkroom.jerome-arfouche.ca/dist;

    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/darkroom.jerome-arfouche.ca/2794764/server.crt;
    ssl_certificate_key /etc/nginx/ssl/darkroom.jerome-arfouche.ca/2794764/server.key;

    # Same TLS settings Forge's site.conf gives the other vhosts (this one has no
    # site.conf include, so without these it inherits the permissive http{} defaults).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    # Security headers. add_header in a location replaces these, so the locations
    # below that set their own headers repeat them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.html;
    charset utf-8;

    # Let's Encrypt HTTP-01 challenge — Forge writes tokens to a shared
    # directory outside the site's own webroot (confirmed via WELLKNOWN in
    # /root/letsencrypt*/config), so this must alias there directly rather
    # than resolve against `root`. ^~ gives this prefix match priority over
    # all regex locations below regardless of order.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        alias /home/forge/.letsencrypt/;
    }

    # --- Bot / scanner mitigation ---
    # Shared rules (scanner UA blocklist, WP/Joomla/IoT/admin probes, dotfile
    # drop) — canonical source: ~/Code/util/infra/nginx/snippets/bot-mitigation.conf
    include snippets/bot-mitigation.conf;

    # To enable rate limiting for this app, uncomment (zone already declared
    # in /etc/nginx/conf.d/rate-limits.conf):
    # limit_req zone=darkroom_api burst=40 nodelay;
    # limit_req_status 429;
    # --- End bot / scanner mitigation ---

    gzip_static on;
    gzip_vary on;

    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/darkroom.jerome-arfouche.ca/after/*;